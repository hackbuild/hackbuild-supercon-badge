<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="badge">
<script src="lib/pwa.js" defer></script>
<title>Crowd Games Stage</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Permanent+Marker&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/ui.css">
<script src="https://cdn.jsdelivr.net/npm/@clasp-to/core@4.3.1/dist/index.global.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous"></script>
<style>
html,body{height:100%}
body{background:var(--void);color:var(--raised);overflow:hidden}
#stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,24vw);gap:2vw;height:100%;padding:2vw;box-sizing:border-box}
#screenBox{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
#screen{max-width:100%;max-height:100%;aspect-ratio:960/672;background:#fff;box-shadow:.6vw .6vw 0 var(--pink)}
aside{display:grid;grid-template-rows:auto auto auto 1fr;gap:1.4vw;min-height:0}
#qr{width:100%;aspect-ratio:1;background:#fff;image-rendering:pixelated}
#room{font:clamp(40px,6vw,120px)/1 var(--inst);letter-spacing:.08em;color:var(--raised)}
#url{font:600 clamp(12px,1vw,18px) var(--mono);color:#cfc8ba;overflow-wrap:anywhere}
#game{font:clamp(22px,2.4vw,48px)/1.05 var(--disp);margin:0}
#count{font:clamp(18px,1.4vw,26px) var(--mono)}
ol{margin:0;padding:0;list-style:none;font:clamp(14px,1.3vw,24px)/1.5 var(--mono);overflow:hidden}
#off{position:fixed;left:2vw;bottom:2vw;font:600 14px var(--mono);color:#ff8a80}
#screenBox{position:relative}
#gif{position:absolute;max-width:100%;max-height:100%;aspect-ratio:960/672;object-fit:contain;background:#fff;box-shadow:.6vw .6vw 0 var(--pink)}
#how{font:clamp(14px,1.2vw,22px)/1.35 var(--type);color:#cfc8ba;margin:0}
#timer{font:clamp(40px,5vw,96px)/1 var(--inst);color:var(--pink)}
</style>
</head>
<body>
<div id="stage">
  <div id="screenBox"><canvas id="screen" width="960" height="672" aria-label="the game, as the badge shows it"></canvas><img id="gif" alt="" hidden></div>
  <aside>
    <canvas id="qr" width="400" height="400" aria-label="qr code to join"></canvas>
    <div><div id="room">----</div><div id="url"></div></div>
    <div><h1 id="game">waiting for a game</h1><p id="how"></p><div id="timer"></div><div id="count"></div></div>
    <ol id="top"></ol>
  </aside>
</div>
<div id="off" role="status">connecting to the relay</div>

<script type="module">
import { Relay } from './lib/relay.js';
import { paths, joinUrl, roomCode, shareBase } from './lib/protocol.js';
import * as S from './lib/screen.js';
import { gameMeta, screenFor } from './games/registry.js';

const $ = id => document.getElementById(id);
let room = (location.hash.slice(1).toUpperCase().match(/^[A-Z0-9]{4}/) || [''])[0];
// An installed shortcut opens this page with no room. The key saved by the host page names it.
if (!room) {
  try { const key = localStorage.getItem('hackbuild-badge.key'); if (key) room = await roomCode(key); } catch (e) { /* no saved key */ }
}
if (!room) { location.replace('host.html'); await new Promise(() => {}); }
const p = paths(room);
const c = $('screen').getContext('2d');
const ink = Object.assign(document.createElement('canvas'), { width: S.W, height: S.H });
const ic = ink.getContext('2d');
let stage = null, screen = null, kind = '', tick = 0, inkFresh = true, epoch = '', view = null, viewAt = 0;

function showJoin(url) {
  $('room').textContent = room;
  $('url').textContent = url.replace('https://', '');
  const q = $('qr').getContext('2d');
  q.fillStyle = '#fff';
  q.fillRect(0, 0, 400, 400);
  S.qr(q, url, 0, 0, 400);
}

function draw() {
  S.clear(c, S.palette(true));
  if (!stage || !stage.kind || !screen) {
    S.text(c, 'scan the code to join', { x: 60, y: 120, w: 840, h: 300 }, { size: 110, valign: 'middle', align: 'center' });
    S.text(c, `room ${room}`, { x: 60, y: 440, w: 840, h: 120 }, { font: `600 {}px ${S.MONO}`, size: 80, align: 'center' });
    return;
  }
  if (screen.live) c.drawImage(ink, 0, 0);
  screen.draw(c, stage.model, { color: true, stage: true, join: stage.join, tick });
}

async function onStage(value) {
  let incoming;
  try { incoming = JSON.parse(value); } catch (e) { return; }
  const next = incoming.kind || '';
  if (next !== kind) {
    // The model, kind and screen change together, so a redraw never pairs one game's screen with another's model.
    try { screen = next ? await screenFor(next) : null; } catch (e) { $('off').textContent = `${next} did not load. reload this page.`; $('off').hidden = false; return; }
    kind = next;
    inkFresh = true;
    ic.fillStyle = '#fff';
    ic.fillRect(0, 0, S.W, S.H);
  }
  stage = incoming;
  $('game').textContent = kind ? gameMeta(kind).name : 'waiting for a game';
  $('how').textContent = kind ? gameMeta(kind).howto : 'scan the code with your phone camera to join.';
  const url = screen && screen.overlay ? screen.overlay(stage.model) : '';
  $('gif').hidden = !url;
  if (url && $('gif').getAttribute('src') !== url) $('gif').src = url;
  $('count').textContent = `${stage.players} phone${stage.players === 1 ? '' : 's'} playing`;
  $('top').replaceChildren(...(stage.top || []).map(([n, s], i) => Object.assign(document.createElement('li'), { textContent: `${i + 1}. ${n}, ${s}` })));
  if (stage.join) showJoin(stage.join.url);
  draw();
}

await S.loadFonts();
showJoin(joinUrl(room, shareBase()));
const relay = new Relay('hack.build stage');
relay.onUp = () => { $('off').hidden = true; };
relay.onDown = () => { $('off').textContent = 'reconnecting'; $('off').hidden = false; };
relay.on(p.stage, onStage);
relay.on(p.view, v => { try { view = JSON.parse(v); viewAt = Date.now(); epoch = view.epoch; } catch (e) { /* not a view */ } });
relay.on(p.live, v => {
  if (!screen || !screen.live) return;
  const s = String(v), bar = s.indexOf('|');
  if (s.slice(0, bar) !== epoch) return;
  screen.applyBatch(ic, s.slice(bar + 1), 1, true);
  draw();
});
relay.on(p.media('ink'), url => {
  if (!url || !inkFresh) return;
  inkFresh = false;
  const img = new Image();
  img.onload = () => { ic.drawImage(img, 0, 0, S.W, S.H); draw(); };
  img.src = String(url);
});
relay.start();

// A projector that dims or sleeps loses the room. The browser drops the lock whenever the page is
// hidden, so it is asked for again on return.
let wake = null;
async function keepAwake() {
  if (wake || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try {
    const lock = await navigator.wakeLock.request('screen');
    lock.addEventListener('release', () => { if (wake === lock) wake = null; });
    wake = lock;
  } catch (e) { /* refused on low battery or by the browser */ }
}
document.addEventListener('visibilitychange', keepAwake);
keepAwake();

setInterval(() => {
  tick++;
  if (kind === 'cinema') draw();
  const left = view && view.left != null && view.kind === kind ? Math.max(0, view.left - (Date.now() - viewAt)) : 0;
  $('timer').textContent = left ? `${Math.ceil(left / 1000)}s` : '';
}, 250);
draw();
</script>
</body>
</html>
